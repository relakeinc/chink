# chink.relake.co — versión canónica (incluye lo gestionado por Certbot).
# Desplegar con: sudo cp nginx/chink.relake.co.conf /etc/nginx/sites-enabled/
# y `sudo nginx -t && sudo systemctl reload nginx`. Solo hay que correr
# `certbot --nginx -d chink.relake.co` la primera vez (ya tiene certificado).
# El frontend es estático (apps/web/dist tras `pnpm build`); /api/* va al backend.
limit_req_zone $binary_remote_addr zone=chink_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=chink_register:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=chink_verify:10m rate=15r/m;

server {
    server_name chink.relake.co;

    root /opt/chink-saas/apps/web/dist;
    index index.html;

    client_max_body_size 12m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self'; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location = /api/auth/register {
        limit_req zone=chink_register burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3102;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/auth/(verify-email|resend-code)$ {
        limit_req zone=chink_verify burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3102;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/login {
        limit_req zone=chink_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Tiempo real (SSE): sin búfer ni caché, conexión larga.
    location = /api/stream {
        access_log off;
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/chink.relake.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/chink.relake.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = chink.relake.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name chink.relake.co;

    listen 80;
    return 404; # managed by Certbot


}

# chink.relake.co — copiar a /etc/nginx/sites-enabled/ y luego:
#   certbot --nginx -d chink.relake.co
# El frontend es estático (apps/web/dist tras `pnpm build`); /api/* va al backend.
server {
    server_name chink.relake.co;

    root /opt/chink-saas/apps/web/dist;
    index index.html;

    client_max_body_size 12m;

    # Tiempo real (SSE): sin búfer ni caché, conexión larga.
    location = /api/stream {
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri /index.html;
    }

    listen 80;
}

# chink.relake.co — versión canónica (incluye lo gestionado por Certbot).
# Desplegar con: sudo cp nginx/chink.relake.co.conf /etc/nginx/sites-enabled/
# y `sudo nginx -t && sudo systemctl reload nginx`. Solo hay que correr
# `certbot --nginx -d chink.relake.co` la primera vez (ya tiene certificado).
# El frontend es estático (apps/web/dist tras `pnpm build`); /api/* va al backend.
server {
    server_name chink.relake.co;

    root /opt/chink-saas/apps/web/dist;
    index index.html;

    client_max_body_size 12m;

    # Tiempo real (SSE): sin búfer ni caché, conexión larga.
    location = /api/stream {
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/chink.relake.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/chink.relake.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = chink.relake.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name chink.relake.co;

    listen 80;
    return 404; # managed by Certbot


}
